services:
    frontend:
        image: nginx:latest
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "8082:80"
        volumes:
            - ./frontend:/usr/share/nginx/html
        environment:
            - API_URL=${API_URL}
        depends_on:
            - backend
        networks:
            - audio-to-text

    backend:
        image: node:latest
        build:
            context: ./backend
            dockerfile: Dockerfile
        volumes:
            - ./backend:/usr/src/app
        ports:
            - "3000:3001"
        environment:
            - FRONTEND_URL=${FRONTEND_URL}
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - PORT=${PORT}
        networks:
            - audio-to-text

networks:
    audio-to-text:
